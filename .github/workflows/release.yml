name: Release
# Changesets flow: merged PRs carry changeset files; on push to main the
# action opens the Version PR (bumps versions, writes changelogs, updates
# internal ranges); merging it runs `changeset publish` for the changed
# packages. Auth is npm trusted publishing (OIDC) — no npm token is stored;
# each package must list this repository and this workflow as a trusted
# publisher with direct `npm publish` allowed. The repo must also allow
# GitHub Actions to create and approve pull requests.
on:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: write
  id-token: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The changelog generator links PRs; it reads the token from the env.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Ask npm itself for provenance on every publish it runs.
      NPM_CONFIG_PROVENANCE: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: npm ci
      - uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: npx changeset publish
